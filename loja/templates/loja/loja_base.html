{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/img/icon-192.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NCS ERP | Loja{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #04060b;
            --panel-bg: rgba(10, 15, 28, 0.85);
            --border-glow: rgba(13, 110, 253, 0.3);
            --text-main: #f1f1f4;
            --text-muted: #8f8f9d;
            --ncs-blue: #0d6efd;
            --ncs-blue-light: #38bdf8;
            --borda: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar idêntica ao ERP principal */
        .sidebar {
            width: 260px;
            box-sizing: border-box;
            background: var(--panel-bg);
            border-right: 1px solid var(--borda);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            text-align: center;
        }

        .sidebar-logo-wrapper {
            width: 100%;
            max-width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px auto;
        }

        .sidebar-logo-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .sidebar-logo-container h5 {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(13, 110, 253, 0.1);
            color: var(--ncs-blue-light);
        }

        /* Destaque para o módulo da loja */
        .nav-item.loja-highlight {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--ncs-blue-light);
            font-weight: 600;
        }

        /* Content */
        .main-content {
            flex: 1;
            padding: 30px;
            background: radial-gradient(circle at top right, rgba(13, 110, 253, 0.05) 0%, transparent 50%);
            transition: all 0.3s ease;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-primary {
            background: var(--ncs-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }

        .btn-primary:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
        }

        .btn-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--borda);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-toggle:hover {
            border-color: var(--ncs-blue);
            color: var(--ncs-blue-light);
        }

        .table-container {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            overflow-x: auto;
        }

        .form-control {
            width: 100%;
            background: #04060b;
            border: 1px solid var(--borda);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: var(--ncs-blue);
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.25);
        }

        body.sidebar-collapsed .sidebar {
            margin-left: -260px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -260px;
                height: 100vh;
                z-index: 1100;
                background: #04060b;
                box-shadow: 10px 0 30px rgba(0,0,0,0.9);
            }
            body.sidebar-open .sidebar { left: 0; }
            .main-content { padding: 15px; }
            .topbar { flex-direction: column; align-items: stretch; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo-container">
            <div class="sidebar-logo-wrapper">
                <video autoplay loop muted playsinline>
                    <source src="{% static 'core/img/ncs_logo.mp4' %}" type="video/mp4">
                </video>
            </div>
            <h5>Módulo Loja & Afiliados</h5>
        </div>

        <!-- Links exclusivos do app Loja -->
        <a href="{% url 'novo_produto_ia' %}" class="nav-item loja-highlight {% block nav_novo_ia %}{% endblock %}">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Cadastrar com IA
        </a>
        <a href="{% url 'gerenciar_produtos' %}" class="nav-item {% block nav_gerenciar %}{% endblock %}">
            <i class="fa-solid fa-pen-to-square"></i> Gerenciar Produtos
        </a>
        <a href="/admin/loja/produtoloja/" target="_blank" class="nav-item">
            <i class="fa-solid fa-database"></i> Painel Admin <i class="fa-solid fa-external-link" style="font-size: 10px; margin-left: auto; opacity: 0.6;"></i>
        </a>
        <a href="https://ncscar.com.br/loja" target="_blank" class="nav-item">
            <i class="fa-solid fa-shopping-bag"></i> Ver Vitrine <i class="fa-solid fa-external-link" style="font-size: 10px; margin-left: auto; opacity: 0.6;"></i>
        </a>
        
        <!-- Botão de Retorno ao ERP Principal -->
        <div style="margin-top: auto;">
            <a href="{% url 'dashboard' %}" class="btn-toggle" style="width: 100%; text-decoration: none; text-align: center; box-sizing: border-box; justify-content: center; color: var(--ncs-blue-light); border-color: rgba(56, 189, 248, 0.3);">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao ERP Principal
            </a>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation(); 
                    if (window.innerWidth <= 768) {
                        document.body.classList.toggle('sidebar-open');
                    } else {
                        document.body.classList.toggle('sidebar-collapsed');
                    }
                });
            }

            document.addEventListener('click', function(event) {
                if (window.innerWidth <= 768 && document.body.classList.contains('sidebar-open')) {
                    if (sidebar && !sidebar.contains(event.target) && toggleBtn && !toggleBtn.contains(event.target)) {
                        document.body.classList.remove('sidebar-open');
                    }
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
