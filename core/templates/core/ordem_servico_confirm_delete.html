{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS ERP | Excluir Ordem de Serviço</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #04060b;
            --panel-bg: rgba(10, 15, 28, 0.85);
            --text-main: #f1f1f4;
            --text-muted: #8f8f9d;
            --ncs-blue: #0d6efd;
            --ncs-blue-light: #38bdf8;
            --danger-red: #ef4444;
            --borda: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.08) 0%, transparent 60%), var(--bg-dark);
        }

        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--borda);
            border-top: 3px solid var(--danger-red);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .warning-icon {
            font-size: 48px;
            color: var(--danger-red);
            margin-bottom: 20px;
        }

        .service-name {
            background: rgba(4, 6, 11, 0.7);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-weight: 600;
            color: var(--ncs-blue-light);
            font-size: 16px;
        }

        .btn-delete {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            margin-top: 10px;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="warning-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 style="margin-top: 0; color: var(--text-main);">Excluir Ordem de Serviço</h2>
        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">
            Você tem certeza de que deseja remover permanentemente a Ordem de Serviço abaixo?
        </p>

        <div class="service-name">
            O.S. #{{ object.id }} - {{ object.cliente.nome }}
        </div>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-delete">
                <i class="fa-solid fa-trash"></i> Sim, Excluir O.S.
            </button>
        </form>

        <a href="{% url 'ordens_servico_list' %}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Cancelar e voltar
        </a>
    </div>

</body>
</html>
