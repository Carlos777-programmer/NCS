{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS ERP | Novo Cliente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #04060b;
            --panel-bg: rgba(10, 15, 28, 0.85);
            --text-main: #f1f1f4;
            --text-muted: #8f8f9d;
            --ncs-blue: #0d6efd;
            --ncs-blue-light: #38bdf8;
            --borda: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top right, rgba(13, 110, 253, 0.08) 0%, transparent 60%), var(--bg-dark);
        }

        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--borda);
            border-top: 3px solid var(--ncs-blue);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(4, 6, 11, 0.7);
            border: 1px solid var(--borda);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--ncs-blue);
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(13, 110, 253, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: var(--ncs-blue-light);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2 style="margin-top: 0; color: var(--ncs-blue-light); display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-user-plus"></i> Novo Cliente
        </h2>
        <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 14px;">Preencha os dados abaixo para registrar o cliente no sistema.</p>

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span style="color: #f75a68; font-size: 12px; margin-top: 5px; display: block;">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Salvar Cliente</button>
        </form>

        <a href="{% url 'clientes_list' %}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Voltar para a listagem
        </a>
    </div>

</body>
</html>
