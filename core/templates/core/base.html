{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NCS ERP{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #04060b;
            --panel-bg: rgba(10, 15, 28, 0.85);
            --border-glow: rgba(13, 110, 253, 0.3);
            --text-main: #f1f1f4;
            --text-muted: #8f8f9d;
            --ncs-blue: #0d6efd;
            --ncs-blue-light: #38bdf8;
            --borda: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            box-sizing: border-box;
            background: var(--panel-bg);
            border-right: 1px solid var(--borda);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        /* Estilo do container da Logo Animada na Sidebar */
        .sidebar-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
            text-align: center;
        }

        .sidebar-logo-wrapper {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .sidebar-logo-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Evita cliques indesejados no vídeo */
        }

        .sidebar-logo-container h2 {
            font-size: 16px;
            color: var(--ncs-blue-light);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(13, 110, 253, 0.1);
            color: var(--ncs-blue-light);
        }

        /* Content */
        .main-content {
            flex: 1;
            padding: 30px;
            background: radial-gradient(circle at top right, rgba(13, 110, 253, 0.05) 0%, transparent 50%);
            transition: all 0.3s ease;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-logout {
            color: #f75a68;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(247, 90, 104, 0.2);
            border-radius: 6px;
            transition: all 0.3s;
            display: inline-block;
            text-align: center;
        }

        .btn-logout:hover {
            background: #f75a68;
            color: white;
        }

        .btn-primary {
            background: var(--ncs-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }

        .btn-primary:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
        }

        /* Botão de Alternar Sidebar (Hambúrguer) */
        .btn-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--borda);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-toggle:hover {
            border-color: var(--ncs-blue);
            color: var(--ncs-blue-light);
        }

        /* Stats Grid / KPIs */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
        }

        .stat-card p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* Table Container Responsivo */
        .table-container {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--borda);
            color: var(--text-muted);
            white-space: nowrap;
        }

        th { color: var(--text-main); }

        /* --- RESPONSIVIDADE E ESTADOS DA SIDEBAR --- */
        body.sidebar-collapsed .sidebar {
            margin-left: -260px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -260px;
                height: 100vh;
                z-index: 1100;
                background: #04060b;
                box-shadow: 10px 0 30px rgba(0,0,0,0.9);
            }

            body.sidebar-open .sidebar {
                left: 0;
            }

            .main-content {
                padding: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar > div:first-child {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .btn-primary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <!-- Logo Animada no Topo da Sidebar -->
        <div class="sidebar-logo-container">
            <div class="sidebar-logo-wrapper">
                <video autoplay loop muted playsinline>
                    <source src="{% static 'core/img/ncs_logo.mp4' %}" type="video/mp4">
                </video>
            </div>
            <h5>"A única maneira de fazer um excelente trabalho é amar o que você faz." — Steve Jobs</h5>
        </div>

        <a href="{% url 'dashboard' %}" class="nav-item {% block nav_dashboard %}{% endblock %}"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="{% url 'clientes_list' %}" class="nav-item {% block nav_clientes %}{% endblock %}"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="{% url 'veiculos_list' %}" class="nav-item {% block nav_veiculos %}{% endblock %}"><i class="fa-solid fa-car"></i> Veículos</a>
        <a href="{% url 'ordens_servico_list' %}" class="nav-item {% block nav_ordens %}{% endblock %}"><i class="fa-solid fa-clipboard-check"></i> Ordens de Serviço</a>
        <a href="{% url 'servicos_list' %}" class="nav-item {% block nav_servicos %}{% endblock %}"><i class="fa-solid fa-wrench"></i> Serviços</a>
        
        <div style="margin-top: auto;">
            <form action="{% url 'logout' %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn-logout" style="width: 100%; background: transparent; border-color: rgba(247, 90, 104, 0.2); cursor: pointer;">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair do Sistema
                </button>
            </form>
        </div>
    </aside>

    {% block content %}{% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('sidebarToggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        document.body.classList.toggle('sidebar-open');
                    } else {
                        document.body.classList.toggle('sidebar-collapsed');
                    }
                });
            }
        });
    </script>
</body>
</html>
